events {}
http {
# DNS nội bộ của Docker: tự tìm IP mới khi service khởi động lại hoặc được scale
resolver 127.0.0.11 valid=5s ipv6=off;
server {
listen 80;
# Giao diện web tĩnh
location / {
root /usr/share/nginx/html;
index index.html;
}
# Mọi request /api/products/... -> product-service
location /api/products {
set $product_upstream http://product-service:5000;
rewrite ^/api/products(.*)$ /products$1 break;
proxy_pass $product_upstream;
}
# Mọi request /api/orders/... -> order-service
location /api/orders {
set $order_upstream http://order-service:3000;
rewrite ^/api/orders(.*)$ /orders$1 break;
proxy_pass $order_upstream;
}
}
}